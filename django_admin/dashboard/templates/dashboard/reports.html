<!doctype html><html><head><meta charset="utf-8"><title>Reports</title><style>body{font:16px Arial;background:#f4f6f9;margin:0}.header{background:#155e75;color:white;padding:20px 6%}.content{max-width:900px;margin:30px auto;background:white;padding:28px;border-radius:10px}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.filters label{display:grid;gap:4px}.filters select,.filters input,.filters button{padding:9px}.reports{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:25px}.report{border:1px solid #d7e0e8;padding:18px;border-radius:8px}.report a{display:inline-block;background:#155e75;color:#fff;padding:8px 10px;border-radius:5px;text-decoration:none;margin:4px 3px 0 0}</style></head><body><header class="header"><h1>Reports & Export</h1></header><main class="content"><form class="filters" method="get"><label>Period<select name="period"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="7d">Last 7 Days</option><option value="30d" selected>Last 30 Days</option><option value="3m">Last 3 Months</option><option value="12m">Last 12 Months</option><option value="custom">Custom Range</option></select></label><label>Start<input type="date" name="start" value="{{ start|date:'Y-m-d' }}"></label><label>End<input type="date" name="end" value="{{ end|date:'Y-m-d' }}"></label><button>Apply filters</button></form><section class="reports"><div class="report"><h2>Orders Report</h2><a href="{% url 'dashboard:orders_csv' %}?{{ request.GET.urlencode }}">CSV</a><a href="{% url 'dashboard:orders_pdf' %}?{{ request.GET.urlencode }}">PDF</a></div><div class="report"><h2>Sales Report</h2><a href="{% url 'dashboard:sales_csv' %}?{{ request.GET.urlencode }}">CSV</a><a href="{% url 'dashboard:sales_pdf' %}?{{ request.GET.urlencode }}">PDF</a></div><div class="report"><h2>Users Report</h2><a href="{% url 'dashboard:users_csv' %}?{{ request.GET.urlencode }}">CSV</a><a href="{% url 'dashboard:users_pdf' %}?{{ request.GET.urlencode }}">PDF</a></div></section></main></body></html>
